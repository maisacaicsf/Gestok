<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gestok | Entrada de estoque</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="../componentes/sidebar.css"
    >

</head>

<body>

    <!-- =========================================
         SIDEBAR UNIVERSAL
    ========================================== -->

    <div id="gestok-sidebar-container"></div>


    <!-- =========================================
         CABEÇALHO
    ========================================== -->

    <header class="header">

        <div class="header-left">

            <button
                class="menu-button"
                id="menuButton"
                aria-label="Abrir menu"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>

            <div class="page-name">
                Entrada de estoque
            </div>

        </div>

    </header>


    <!-- =========================================
         CONTEÚDO
    ========================================== -->

    <main class="page">

        <div class="page-header">

            <div>

                <span class="eyebrow">
                    ESTOQUE
                </span>

                <h1>
                    Entrada de estoque
                </h1>

                <p>
                    Registre a entrada de produtos no estoque.
                </p>

            </div>

        </div>


        <!-- =====================================
             FORMULÁRIO
        ====================================== -->

        <section class="product-container">

            <div class="form-header">

                <div>

                    <h2>
                        Registrar entrada
                    </h2>

                    <p>
                        Selecione o produto e informe a quantidade recebida.
                    </p>

                </div>

            </div>


            <form id="entradaForm">

                <div class="form-grid">


                    <!-- PRODUTO -->

                    <div class="form-group full">

                        <label for="produto">
                            Produto *
                        </label>

                        <select
                            id="produto"
                            name="produto"
                            required
                        >

                            <option value="">
                                Carregando produtos...
                            </option>

                        </select>

                    </div>


                    <!-- ESTOQUE ATUAL -->

                    <div class="form-group">

                        <label>
                            Estoque atual
                        </label>

                        <div
                            class="stock-display"
                            id="estoqueAtual"
                        >
                            -
                        </div>

                    </div>


                    <!-- UNIDADE -->

                    <div class="form-group">

                        <label>
                            Unidade
                        </label>

                        <div
                            class="stock-display"
                            id="unidadeProduto"
                        >
                            -
                        </div>

                    </div>


                    <!-- QUANTIDADE -->

                    <div class="form-group">

                        <label for="quantidade">
                            Quantidade de entrada *
                        </label>

                        <input
                            type="number"
                            id="quantidade"
                            name="quantidade"
                            min="0.01"
                            step="0.01"
                            placeholder="Ex.: 10"
                            required
                        >

                    </div>


                    <!-- NOVO ESTOQUE -->

                    <div class="form-group">

                        <label>
                            Novo estoque
                        </label>

                        <div
                            class="stock-display highlight"
                            id="novoEstoque"
                        >
                            -
                        </div>

                    </div>


                    <!-- MOTIVO -->

                    <div class="form-group full">

                        <label for="motivo">
                            Motivo da entrada
                        </label>

                        <select
                            id="motivo"
                            name="motivo"
                        >

                            <option value="">
                                Selecione um motivo
                            </option>

                            <option value="Compra">
                                Compra
                            </option>

                            <option value="Devolução">
                                Devolução
                            </option>

                            <option value="Reposição">
                                Reposição
                            </option>

                            <option value="Ajuste de estoque">
                                Ajuste de estoque
                            </option>

                            <option value="Outros">
                                Outros
                            </option>

                        </select>

                    </div>


                    <!-- OBSERVAÇÃO -->

                    <div class="form-group full">

                        <label for="observacao">
                            Observação
                        </label>

                        <textarea
                            id="observacao"
                            name="observacao"
                            rows="4"
                            placeholder="Digite uma observação sobre esta entrada..."
                        ></textarea>

                    </div>

                </div>


                <!-- =================================
                     RODAPÉ
                ================================== -->

                <div class="form-footer">

                    <a
                        href="../sistema/index.html"
                        class="secondary-button"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        ↓ Registrar entrada
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- =========================================
         FIREBASE
    ========================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


    <!-- =========================================
         CONFIGURAÇÃO FIREBASE
    ========================================== -->

    <script src="../firebase/config.js"></script>

    <script>

        if (!firebase.apps.length) {

            firebase.initializeApp(firebaseConfig);

        }

    </script>


<!-- =========================================
     FIREBASE
========================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<!-- =========================================
     FIREBASE CONFIG
========================================= -->

<script src="../firebase/config.js"></script>

<script>

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

</script>


<!-- =========================================
     FIREBASE HELPERS
========================================= -->

<script src="../firebase/auth.js"></script>

<script src="../firebase/firestore.js"></script>

<script src="../auth.js"></script>


<!-- =========================================
     SIDEBAR
========================================= -->

<script src="../componentes/sidebar.js"></script>


<!-- =========================================
     ENTRADA
========================================= -->

<script src="script.js"></script>

</body>

</html>
